<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" xmlns:th="https://www.thymeleaf.org">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" th:href="@{/css/__${fragment}__.css}" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

</head>
<body>
<div class="page-container">
    <div class="page-sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="header-button"  onclick="document.location='/account'">
                <span class="hover-underline-animation left" th:text="${username}">Andrew Smith</span>
            </button>
        </div>
        <hr class="line"/>
        <div class="menu-container">
            <ul class="menu">
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('homePage')} ? ' active'"
                            onclick="document.location='/home'">
                        <img class="button-icon" src="/images/Home-page.png" alt="Home Page Image">
                        <span>Home page</span>
                    </button>
                </li>
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('account')} ? ' active'"
                            onclick="document.location='/account'">
                        <img class="button-icon" src="/images/Account.png" alt="Account Image">
                        <span>Account</span>
                    </button>
                </li>
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('notification')} ? ' active'"
                            onclick="document.location='/notifications'">
                        <img class="button-icon" src="/images/Notification.png" alt="Notification Image">
                        <span>Notification</span>
                    </button>
                </li>
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('recent')} ? ' active'"
                            onclick="document.location='/recent'">
                        <img class="button-icon" src="/images/Recent.png" alt="Recent Image">
                        <span>Recent</span>
                    </button>
                </li>
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('scenarios')} ? ' active'"
                            onclick="document.location='/scenario'">
                        <img class="button-icon" src="/images/Scenarios.png" alt="Scenarios Image">
                        <span>Scenarios</span>
                    </button>
                </li>
            </ul>
        </div>
        <hr class="line"/>
        <div class="sidebar-footer">
            <button class="footer-button help-button">
                <img class="button-icon" src="/images/Help.png"
                     alt="Help Image"><span class="hover-underline-animation left">Help</span>
            </button>
            <form th:action="@{/logout}" method="post" name="logoutForm">
                <button id="logoutLink" class="footer-button logout-button" type="submit">
                    <img class="button-icon" src="/images/Logout.png"
                         alt="Logout account image"><span class="hover-underline-animation left">Logout account</span>
                </button>
            </form>
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <span>HOME PAGE</span>
        </div>
        <div class="content">
            <div th:replace="~{fragments/fragments::__${fragment}__}"></div>
        </div>
    </div>
</div>
</body>
</html>
