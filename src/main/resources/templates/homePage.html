<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <th:block th:replace="~{fragments/fragments::page_head}"></th:block>
</head>
<body>
<div class="page-container">
    <script src="/js/webSocketNotification.js"></script>
    <script src="/js/accountChangePassword.js"></script>
    <script src="/js/utils.js"></script>
    <div class="page-sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="header-username" disabled>
                <span class="left" th:text="${username}">Andrew Smith</span>
            </button>
            <button class="header-button" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                <span class="hover-underline-animation left">Изменить пароль</span>
            </button>
        </div>
        <hr class="line"/>
        <div class="menu-container">
            <ul class="menu">
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('homePage')} ? ' active'"
                            onclick="document.location='/home'">
                        <img class="button-icon" src="/images/Home-page.png" alt="Home Page Image">
                        <span>Главная страница</span>
                    </button>
                </li>
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('history')} ? ' active'"
                            onclick="document.location='/history'">
                        <img class="button-icon" src="/images/Recent.png" alt="Recent Image">
                        <span>История</span>
                    </button>
                </li>
                <li>
                    <button class="menu-button"
                            th:classappend="${fragment.equals('scenario')} ? ' active'"
                            onclick="document.location='/scenario'">
                        <img class="button-icon" src="/images/Scenarios.png" alt="Scenarios Image">
                        <span>Сценарий</span>
                    </button>
                </li>
                <li sec:authorize="hasAuthority('ADMIN')">
                    <button class="menu-button"
                            th:classappend="${fragment.equals('logs')} ? ' active'"
                            onclick="document.location='/admin/logs'">
                        <img class="button-icon" src="/images/logs.svg" alt="Logs Image">
                        <span>Логи</span>
                    </button>
                </li>
                <li sec:authorize="hasAuthority('ADMIN')">
                    <button class="menu-button"
                            th:classappend="${fragment.equals('users')} ? ' active'"
                            onclick="document.location='/admin/users'">
                        <img class="button-icon" src="/images/users.svg" alt="Users Image">
                        <span>Пользователи</span>
                    </button>
                </li>
            </ul>
        </div>
        <hr class="line"/>
        <div class="sidebar-footer">
            <button class="footer-button help-button">
                <img class="button-icon" src="/images/Help.png"
                     alt="Help Image"><span class="hover-underline-animation left" onclick="startIntro()">Помощь</span>
            </button>
            <form th:action="@{/logout}" method="post" name="logoutForm">
                <button id="logoutLink" class="footer-button logout-button" type="submit">
                    <img class="button-icon" src="/images/Logout.png"
                         alt="Logout account image"><span
                        class="hover-underline-animation left">Выйти из аккаунта</span>
                </button>
            </form>
        </div>
    </div>
    <div class="main-content">
        <div class="header">
            <span th:text="${pageTitle}"></span>
            <div class="alert-text" id="emergencyMessage" style="display: none;">
                ⚠️ ЭКСТРЕННАЯ ОСТАНОВКА АКТИВИРОВАНА ⚠️
            </div>
        </div>
        <div class="content">
            <div th:replace="~{fragments/fragments::__${fragment}__}"></div>
        </div>
    </div>
</div>
<input type="hidden" id="emergencyFlag" th:value="${emergencyStopActive}" />
<script>
    function getButtonsToDisable() {
        const gestureButtons = document.querySelectorAll(".gesture-button");
        const otherButtons = [
            document.getElementById("exportButton"),
            document.getElementById("importButton"),
            document.getElementById("inputButton")
        ].filter(Boolean);

        return [...gestureButtons, ...otherButtons];
    }

    function activateEmergencyMode() {
        $('#emergencyMessage').show();

        const buttonsToDisable = getButtonsToDisable();
        buttonsToDisable.forEach(button => {
            button.disabled = true;
            button.classList.remove("btn-outline-primary", "btn-outline-success");
            button.classList.add("btn-secondary");
        });

        $('#emergencyStopButton').hide();
        $('#resumeSystemButton').show();
    }

    function deactivateEmergencyMode() {
        $('#emergencyMessage').hide();

        const buttonsToDisable = getButtonsToDisable();
        buttonsToDisable.forEach(button => {
            button.disabled = false;
            button.classList.remove("btn-secondary");

            if (!button.classList.contains("gesture-button")) {
                button.classList.add("btn-outline-primary");
            }

            if (button.id === "inputButton") {
                button.classList.add("btn-outline-success");
            }
        });

        $('#resumeSystemButton').hide();
        $('#emergencyStopButton').show();
    }

    $(document).ready(function () {
        const emergencyFlag = $('#emergencyFlag').val();
        if (emergencyFlag === 'true') {
            activateEmergencyMode();
        }

        $('#emergencyStopButton').click(function () {
            $.ajax({
                type: 'POST',
                url: '/api/emergency/activate',
                success: function (response) {
                    console.log(response.message);
                    activateEmergencyMode();
                },
                error: function () {
                    alert('Ошибка при активации экстренной остановки');
                }
            });
        });

        $('#resumeSystemButton').click(function () {
            $('#resumeConfirmationModal').modal('show');
        });

        $('#confirmResumeButton').click(function () {
            $.ajax({
                type: 'POST',
                url: '/api/emergency/deactivate',
                success: function (response) {
                    console.log(response.message);
                    deactivateEmergencyMode();
                    $('#resumeConfirmationModal').modal('hide');
                },
                error: function () {
                    alert('Ошибка при деактивации экстренной остановки');
                }
            });
        });
    });
</script>
<div class="modal fade" id="resumeConfirmationModal" tabindex="-1" aria-labelledby="resumeConfirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="resumeConfirmationModalLabel">Подтверждение запуска</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                Вы проверили систему. Уверены, что хотите произвести запуск?
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отменить</button>
                <button type="button" class="btn btn-success" id="confirmResumeButton">Запустить</button>
            </div>
        </div>
    </div>
</div>
<div th:insert="~{fragments/fragments::changePasswordModal}"></div>
<div th:insert="~{fragments/fragments::toastContainer}"></div>
</body>
</html>
