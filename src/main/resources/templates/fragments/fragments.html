<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head th:fragment="page_head(title,remove)" th:remove="${remove}">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <title>[[${title}]]</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
          crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        crossorigin="anonymous">
  <script type="text/javascript" src="/js/logout_methods.js"></script>
</head>
<body>

<div th:each="gesture : ${gestures}">
  <button
          class="gesture-button btn btn-outline-primary m-2"
          data-bs-toggle="modal"
          data-bs-target="#gestureModal"
          th:data-id="${gesture.id}"
          th:data-name="${gesture.name}"
  >
    <img th:src="@{'/images/' + ${gesture.name} + '.png'}" th:alt="${gesture.name}" width="100" />
  </button>
</div>

<div th:fragment="homePage">
  <script src="/js/homePage.js"></script>
  <div class="home-page-container">
    <div class="gesture-box">
      <span class="topic-name">GESTURES</span>
      <div class="gestures">
        <div th:each="gesture : ${gestures}">
          <button class="gesture-button" th:value="${gesture.id}"
              data-bs-toggle="modal"
              data-bs-target="#gestureModal"
              th:data-id="${gesture.id}"
              th:data-title="${gesture.title}"
              th:data-name="${gesture.name}"
          >
            <img th:src="@{${'/images/'+gesture.name + '.png'}}" th:alt="${gesture.name}" />
          </button>
        </div>
      </div>
    </div>
    <div class="last-events">
      <span class="topic-name">ПОСЛЕДНИЕ ДЕЙСТВИЯ</span>
      <div class="event-table">
        <table class="table table-bordered ">
          <thead>
            <tr>
              <th scope="col">Дата и время</th>
              <th scope="col">Жест</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="event : ${events}" th:unless="${events.isEmpty()}">
              <td>[[${event.dateTime}]]</td>
              <td>[[${event.gesture}]]</td>
            </tr>
            <tr th:if="${events.isEmpty()}">
              <td colspan="2" style="text-align: center;">Список событий пуст</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade rounded-lg" id="gestureModal" tabindex="-1" aria-labelledby="gestureModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form method="post" th:action="@{/gestures}">
        <input type="hidden" name="gestureId" id="gestureIdInput" />
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="gestureNameLabel"></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            <img id="gesturePreview" src="" alt="Предпросмотр жеста" class="img-fluid rounded my-2" />
          </div>
          <div class="modal-footer d-flex justify-content-evenly">
            <button type="submit" class="btn" style="color: #FFFFFF; background-color: var(--success-color)">Выполнить</button>
            <button type="button" class="btn" data-bs-dismiss="modal" style="color: #FFFFFF; background-color: var(--danger-color)">Закрыть</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
