<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/css/registration.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
<script src="/js/utils.js"></script>
<form th:action="@{/registration}" method="post" id="registrationForm" th:object="${userDto}">
    <div class="page-container">
        <div class="content">
            <div class="hand-icon">
                <img class="" src="/images/hand-icon-auth.svg" alt="hand icon">
            </div>
            <div class="main-content">
                <span class="login-title">РЕГИСТРАЦИЯ</span>
                <div class="login-input-group">
                    <div class="input-wrapper">
                        <span class="icon"><img src="/images/username-icon.svg" alt="Username Icon"/></span>
                        <input type="text" id="username-input" required th:field="*{username}" minlength="3"
                               maxlength="20"
                               pattern="[A-Za-z0-9]+" title="Только латинские буквы и цифры"
                               placeholder="Введите имя учётной записи"/>
                    </div>
                    <div class="input-wrapper">
                        <span class="icon"><img src="/images/password-icon.svg" alt="Password Icon"/></span>
                        <input type="password" id="password-input" required th:field="*{password}" minlength="8"
                               maxlength="30"
                               placeholder="Введите пароль"/>
                        <button type="button" class="toggle-password" onclick="togglePassword('password-input')">
                            <span id="show-button-text-password-input">Показать</span>
                        </button>
                    </div>
                    <div class="input-wrapper">
                        <span class="icon"><img src="/images/password-icon.svg" alt="Password Icon"/></span>
                        <input type="password" required id="repeat-password-input" minlength="8" maxlength="30"
                               placeholder="Повторите пароль"/>
                        <button type="button" class="toggle-password" onclick="togglePassword('repeat-password-input')">
                            <span id="show-button-text-repeat-password-input">Показать</span>
                        </button>
                    </div>
                    <button type="button" id="submit-form-button" class="login-button">ЗАРЕГИСТРИРОВАТЬСЯ</button>
                    <div class="registration-link">
                        <span>Уже есть аккаунт? <a href="/login">Входи!</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
<div th:insert="~{fragments/fragments::toastContainer}"></div>
<div th:replace="~{fragments/fragments::exceptionToastActivator}"></div>
<script>
    document.getElementById("submit-form-button").addEventListener("click", function (e) {
        const password = document.getElementById("password-input");
        const repeatPassword = document.getElementById("repeat-password-input");
        const form = document.getElementById("registrationForm");

        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        if (password.value !== repeatPassword.value) {
            showExceptionToast("Пароли не совпадают.");
            return;
        }

        form.submit();
    });
    </script>
</body>
</html>
