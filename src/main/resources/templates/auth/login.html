<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

</head>
<body>
<script src="/js/utils.js"></script>
<form th:action="@{/login}" method="post">
    <div class="page-container">
        <div class="content">
            <div class="hand-icon">
                <img class="" src="/images/hand-icon-auth.svg" alt="hand icon">
            </div>

            <div class="main-content">
                <span class="login-title">ВХОД</span>
                <div class="login-input-group">
                    <div class="input-wrapper">
                        <span class="icon"><img src="/images/username-icon.svg" alt="Username Icon"/></span>
                        <input type="text" name="username" id="username" required placeholder="Введите имя учётной записи"/>
                    </div>
                    <div class="input-wrapper">
                        <span class="icon"><img src="/images/password-icon.svg" alt="Password Icon"/></span>
                        <input type="password" name="password" required id="password" placeholder="Введите пароль"/>
                        <button type="button" class="toggle-password" onclick="togglePassword('password')">
                            <span id="show-button-text-password">Показать</span>
                        </button>
                    </div>
                    <div class="remember-me">
                        <label>
                            <input type="checkbox" name="remember-me" id="remember-me">
                            Запомнить меня
                        </label>
                    </div>
                    <button type="submit" class="login-button">ВОЙТИ В СИСТЕМУ</button>
                    <div class="registration-link">
                        <span>Нет аккаунта? <a href="/registration">Регистрируйся!</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
<div th:insert="~{fragments/fragments::toastContainer}"></div>
<div th:if="${param.error}">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            showExceptionToast("Неверный логин или пароль. Либо запись не активна");
        });
    </script>
</div>

<script th:if="${message}" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        showSuccessToast([[${message}]]);
    });
</script>
</body>
</html>
