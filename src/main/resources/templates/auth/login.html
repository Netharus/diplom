<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

</head>
<body>
<form th:action="@{/login}" method="post">
    <div class="page-container">
        <div class="content">
            <div class="hand-icon">
                <img class="" src="/images/hand-icon-auth.svg" alt="hand icon">
            </div>

            <div class="main-content">
                <span class="login-title">ВХОД</span>
                <div class="login-input-group">
                    <div class="input-wrapper">
                        <span class="icon"><img src="/images/username-icon.svg" alt="Username Icon"/></span>
                        <input type="text" name="username" id="username" required placeholder="Введите имя учётной записи"/>
                    </div>
                    <div class="input-wrapper">
                        <span class="icon"><img src="/images/password-icon.svg" alt="Password Icon"/></span>
                        <input type="password" name="password" required id="password" placeholder="Введите пароль"/>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <span id="show-button-text">Показать</span>
                        </button>
                    </div>
                    <button type="submit" class="login-button">ВОЙТИ В СИСТЕМУ</button>
                    <div class="registration-link">
                        <span>Нет аккаунта? <a href="/registration">Регистрируйся!</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
<div th:if="${param.error}" th:insert="~{fragments/fragments::exceptionToast}"></div>
<div th:if="${param.error}">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const toastText = document.getElementById("toastText");
            toastText.textContent = "Неверный логин или пароль. Либо запись не активна";
            const toast = new bootstrap.Toast(document.getElementById("toast"));
            toast.show();
        });
    </script>
</div>
<div class="position-fixed top-0 end-0 p-3" style="z-index: 9999"
     th:if="${message}">
    <div id="toast"
         class="toast show align-items-center text-white bg-success border-0"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         data-bs-autohide="true"
         data-bs-delay="5000">
        <div class="d-flex">
            <div class="toast-body">
                <p th:text="${message}"></p>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast" aria-label="Закрыть"></button>
        </div>
    </div>
</div>
<script>
    function togglePassword() {
        const input = document.getElementById("password");
        const icon = document.getElementById("show-button-text");

        const isPassword = input.type === "password";
        input.type = isPassword ? "text" : "password";
        icon.textContent = isPassword ? "Скрыть" : "Показать";
    }
</script>
</body>
</html>
