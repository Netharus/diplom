databaseChangeLog:
  - changeSet:
      id: 3.2.1
      author: Mikhail Kondratsiuk
      changes:
        - addColumn:
            tableName: logs
            columns:
              - column:
                  name: message
                  type: varchar(255)
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: logs
            columnName: message