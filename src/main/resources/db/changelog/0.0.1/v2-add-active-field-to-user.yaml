databaseChangeLog:
  - changeSet:
      id: 2.1.1
      author: Mikhail Kondratsiuk
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
      rollback:
        - dropColumn:
            tableName: users
            columnName: active
