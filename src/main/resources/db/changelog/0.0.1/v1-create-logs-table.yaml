databaseChangeLog:
  - changeSet:
      id: 1.2.1
      author: Mikhail Kondratsiuk
      changes:
        - createTable:
            tableName: logs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_logs_users
                    references: users(id)
              - column:
                  name: date_time
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
                    checkConstraint: "status in ('SUCCESS', 'ERROR')"