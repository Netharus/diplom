databaseChangeLog:
  - changeSet:
      id: 1.3.1
      author: Mikhail Kondratsiuk
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_users
                    references: users(id)
              - column:
                  name: date_time
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: gesture
                  type: varchar(255)
                  constraints:
                    nullable: false